spring.application.name=platform

# Server Configuration
server.port=8081

# File Upload limits (Resume uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
# 512-bit HS512 secret key
app.jwt.secret=9a67471b7f1910d2ee7f8a9e8b90c29a8f2762e84d9bc21a64f3319087c53e8d2e825a07c5e2d19f8a37b3f9b2d8e4f16a048a1c89012a456ef192bc93847e09
# 24 Hours (in milliseconds)
app.jwt.expiration-ms=86400000

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Default Profile: H2 In-Memory Database (for easy out-of-the-box running)
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
